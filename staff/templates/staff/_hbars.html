{% load i18n %}
<section class="card chart-card" aria-labelledby="{{ id }}-title">
  <h2 id="{{ id }}-title">{{ title }}</h2>
  {% if note %}<p class="help">{{ note }}</p>{% endif %}
  <ul class="hbars">
    {% for item in items %}
      <li tabindex="0" data-tip-value="{{ item.count }}" data-tip-label="{{ item.label }}">
        <span class="hbar-label">{{ item.label }}</span>
        <span class="hbar-track"><span class="hbar{% if item.closed %} hbar-muted{% endif %}" style="width: {{ item.pct_of_max }}%"></span><span class="hbar-value">{{ item.count }}</span></span>
      </li>
    {% endfor %}
  </ul>
</section>
