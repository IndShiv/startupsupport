services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: buss
      POSTGRES_USER: buss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buss-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buss -d buss"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://buss:${POSTGRES_PASSWORD:-buss-dev-password}@db:5432/buss
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Local email inbox for development: http://localhost:8025
  # Start with `docker compose --profile dev up` and set EMAIL_PROVIDER=smtp, EMAIL_HOST=mailpit,
  # EMAIL_PORT=1025, EMAIL_USE_TLS=0 in .env.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports:
      - "8025:8025"

volumes:
  pgdata:
  media:
