<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:12px 0 20px;font-size:14px;">
{% for title, rows in sections %}
  <tr><td colspan="2" style="padding:14px 0 6px;font-weight:bold;color:#00426e;border-bottom:2px solid #ed7623;">{{ title }}</td></tr>
  {% for label, value in rows %}
  <tr>
    <td style="padding:6px 12px 6px 0;vertical-align:top;color:#4b5563;width:40%;border-bottom:1px solid #e5e7eb;">{{ label }}</td>
    <td style="padding:6px 0;vertical-align:top;border-bottom:1px solid #e5e7eb;">{{ value|linebreaksbr }}</td>
  </tr>
  {% endfor %}
{% endfor %}
</table>
